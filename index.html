<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Game Pixel 2D Phục Hồi Chức Năng - Web Edition</title>
    <link rel="icon" type="image/png" href="game.icon.png" />
    <script src="coi-serviceworker.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #0b0c10;
            color: #f0f0f0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* Khung game toàn màn hình giữ tỷ lệ 16:9 sắc nét */
        .game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: calc(100vh * 16 / 9);
            max-height: calc(100vw * 9 / 16);
            aspect-ratio: 16 / 9;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95);
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            border: none;
        }

        /* Màn hình chờ nạp WebAssembly */
        #status {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #14171f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            z-index: 100;
        }
        #status-progress {
            width: 40%;
            height: 10px;
            accent-color: #ffb300;
        }
        #status-text {
            color: #ffe082;
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* Toast nhắc nhở bật quyền camera nếu trình duyệt chặn */
        #camera-perm-toast {
            display: none;
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(183, 28, 28, 0.92);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #ff5252;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 95;
            text-align: center;
        }
        #camera-perm-toast button {
            margin-left: 10px;
            padding: 4px 10px;
            background: #ffb300;
            color: #000;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Video và Canvas xử lý ngầm (Offscreen) */
        .hidden-worker {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Canvas Game Godot Engine -->
        <canvas id="canvas"></canvas>

        <!-- Toast nhắc cấp quyền Camera nếu trình duyệt chặn -->
        <div id="camera-perm-toast">
            📷 Vui lòng cấp quyền Camera trên trình duyệt để nhận diện khớp vai!
            <button onclick="window.GamePHCN_Bridge.startCamera()">Cấp quyền lại</button>
        </div>

        <!-- Màn hình nạp WebAssembly -->
        <div id="status">
            <img src="game.png" alt="Logo" style="max-width: 110px; border-radius: 8px;">
            <progress id="status-progress" value="0" max="100"></progress>
            <div id="status-text">Đang tải WebAssembly Game...</div>
        </div>
    </div>

    <!-- Các thẻ xử lý MediaPipe & Camera ngầm không che khuất màn hình game -->
    <video id="webcam" class="hidden-worker" autoplay playsinline muted></video>
    <canvas id="pose-canvas" class="hidden-worker" width="480" height="360"></canvas>

    <!-- Nạp MediaPipe Bridge JS -->
    <script src="mediapipe_bridge.js"></script>

    <!-- Nạp Godot Wasm Engine -->
    <script src="game.js"></script>
    <script>
        const GODOT_CONFIG = {
            "args": [],
            "canvasResizePolicy": 2,
            "executable": "game",
            "fileSizes": { "game.pck": 2711804, "game.wasm": 39514754 },
            "focusCanvas": true,
        };
        const engine = new Engine(GODOT_CONFIG);

        const statusOverlay = document.getElementById('status');
        const statusProgress = document.getElementById('status-progress');
        const statusText = document.getElementById('status-text');

        // Khởi động nạp Game Wasm
        engine.startGame({
            'onProgress': function (current, total) {
                if (total > 0) {
                    statusProgress.value = current;
                    statusProgress.max = total;
                    statusText.textContent = `Đang nạp tài nguyên... (${Math.round((current / total) * 100)}%)`;
                }
            }
        }).then(() => {
            statusOverlay.style.display = 'none';
            console.log("[Godot] Game đã khởi động toàn màn hình thành công!");
        }).catch((err) => {
            console.error("[Godot] Lỗi khởi động game: ", err);
            statusText.textContent = "Lỗi nạp game: " + err;
        });

        // Tự động khởi tạo Camera và MediaPipe khi DOM đã nạp
        window.addEventListener("DOMContentLoaded", () => {
            window.GamePHCN_Bridge.init("webcam", "pose-canvas").catch(err => {
                console.warn("[Bridge] Lỗi khởi tạo camera:", err);
            });
        });
    </script>
</body>
</html>
